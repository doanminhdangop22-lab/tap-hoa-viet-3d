name: Build Tap Hoa 3D

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-all:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          CMDLINE_BIN=$(ls -d "$SDK_DIR"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1 || true)
          BUILD_TOOLS_BIN=$(ls -d "$SDK_DIR"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -n "$CMDLINE_BIN" ]; then echo "$CMDLINE_BIN" >> "$GITHUB_PATH"; fi
          if [ -d "$SDK_DIR/platform-tools" ]; then echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"; fi
          if [ -n "$BUILD_TOOLS_BIN" ]; then echo "$BUILD_TOOLS_BIN" >> "$GITHUB_PATH"; fi
          yes | "$CMDLINE_BIN/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Unpack and Build APK + Web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f tapHoa3D_source.zip ]; then unzip -o -q tapHoa3D_source.zip; fi
          chmod +x ci_build.sh
          ./ci_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TapHoaViet3D-Android-APK
          path: build/android/TapHoaViet3D.apk
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: build/web/
      - uses: actions/deploy-pages@v4
        continue-on-error: true
