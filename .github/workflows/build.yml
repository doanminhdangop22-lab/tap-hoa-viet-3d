name: Build Tap Hoa 3D

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-all:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unpack and Build APK + Web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f tapHoa3D_source.zip ]; then unzip -o -q tapHoa3D_source.zip; fi
          chmod +x ci_build.sh
          ./ci_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TapHoaViet3D-Android-APK
          path: build/android/TapHoaViet3D.apk
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: build/web/
      - uses: actions/deploy-pages@v4
        continue-on-error: true
